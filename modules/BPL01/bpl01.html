{% extends "base.html" %}

{% block title %}Berth Planning - PORTMAN{% endblock %}

{% block head %}
<style>
.bpl-wrap { display: flex; gap: 14px; align-items: flex-start; }
.bpl-side { flex: 0 0 216px; }
.bpl-lanes { flex: 1; min-width: 0; }

.bpl-panel-hdr {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #64748B; margin: 0 0 8px; display: flex; align-items: center; gap: 6px;
}
.bpl-panel-hdr label { font-weight: 500; letter-spacing: 0; text-transform: none; }

/* vessel cards — the drag sources */
.bpl-ev {
    border: 1px solid #CBD5E1; border-left: 3px solid #2563EB; border-radius: 6px;
    background: #fff; padding: 8px 10px; margin-bottom: 6px; cursor: grab;
}
.bpl-ev.vcn { border-left-color: #7C3AED; }
.bpl-ev:active { cursor: grabbing; }
.bpl-ev.dragging { opacity: .4; }
.bpl-ev-name { font-size: 12px; font-weight: 700; color: #0F172A; display: flex; gap: 6px; align-items: baseline; }
.bpl-ev-meta { font-size: 10px; color: #64748B; margin-top: 2px; }
.bpl-src {
    font-size: 8px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px;
    border-radius: 999px; background: #EFF6FF; color: #1D4ED8;
}
.bpl-src.vcn { background: #F5F3FF; color: #6D28D9; }
.bpl-empty { font-size: 11px; color: #94A3B8; font-style: italic; padding: 6px 2px; }

/* berth lanes — the drop targets */
.bpl-lane {
    border: 1px solid #E2E8F0; border-radius: 8px; background: #fff;
    margin-bottom: 10px; overflow: hidden;
}
.bpl-lane.drop-over { border-color: #2563EB; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
.bpl-lane-hdr {
    background: #F8FAFC; border-bottom: 1px solid #E2E8F0; padding: 6px 12px;
    font-size: 11px; font-weight: 700; color: #0F172A;
    display: flex; align-items: center; gap: 8px;
}
.bpl-lane-hdr .free { margin-left: auto; font-size: 9px; font-weight: 500; color: #94A3B8; }
.bpl-lane-body { padding: 10px 12px; min-height: 34px; }

/* one vessel block: title bar + its line-item table */
.bpl-vessel { margin-bottom: 14px; }
.bpl-vessel:last-child { margin-bottom: 0; }
.bpl-vessel-hdr {
    display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px;
    border: 1px solid #F59E0B; border-radius: 4px; padding: 3px 8px; background: #FFFBEB;
}
.bpl-vessel-hdr b { color: #0F172A; }
.bpl-vessel-hdr .times { margin-left: auto; font-family: 'DM Mono', monospace; color: #475569; }
.bpl-sim { font-size: 10px; color: #475569; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
.bpl-sim input { cursor: pointer; }
.bpl-tag {
    font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px;
}
.bpl-tag.actual { background: #DCFCE7; color: #15803D; }
.bpl-conflict {
    font-size: 10px; font-weight: 600; color: #B91C1C;
    background: #FEF2F2; border: 1px solid #FECACA; border-radius: 4px; padding: 1px 6px;
}
.bpl-vessel.conflict .bpl-vessel-hdr { border-color: #DC2626; background: #FEF2F2; }
/* actuals: rendered, never editable */
table.bpl-items.readonly td { background: #F8FAFC; color: #475569; }
table.bpl-items.readonly td.time { color: #15803D; }

table.bpl-items { border-collapse: collapse; width: 100%; font-size: 10px; }
table.bpl-items th {
    background: #F1F5F9; border: 1px solid #E2E8F0; padding: 3px 6px;
    font-weight: 700; color: #334155; text-align: center; white-space: nowrap;
}
table.bpl-items td { border: 1px solid #E2E8F0; padding: 1px 4px; text-align: center; }
table.bpl-items td.particular { text-align: left; padding-left: 8px; }
table.bpl-items tr.doc td { background: #F8FAFC; font-weight: 600; color: #475569; }
table.bpl-items tr.delay td { background: #FFFBEB; }
table.bpl-items tr.broken td.time { color: #B91C1C; font-style: italic; }
table.bpl-items input, table.bpl-items select {
    font-family: 'DM Mono', monospace; font-size: 10px; width: 100%;
    border: 1px solid transparent; border-radius: 3px; padding: 2px 4px;
    background: transparent; outline: none; text-align: center;
}
table.bpl-items input:hover, table.bpl-items select:hover { border-color: #CBD5E1; }
table.bpl-items input:focus, table.bpl-items select:focus { border-color: #2563EB; background: #fff; }
table.bpl-items input.name { text-align: left; }
table.bpl-items td.time { font-family: 'DM Mono', monospace; color: #1D4ED8; white-space: nowrap; }
table.bpl-items td.hours { font-family: 'DM Mono', monospace; background: #F1F5F9; font-weight: 700; }

.bpl-addrow { margin-top: 4px; display: flex; gap: 10px; align-items: center; }
.bpl-linkbtn {
    border: none; background: none; cursor: pointer; color: #2563EB;
    font-size: 10px; padding: 0; text-decoration: underline;
}
.bpl-linkbtn.warn { color: #B45309; }
.bpl-remove {
    border: none; background: none; cursor: pointer; color: #CBD5E1; font-size: 12px;
    padding: 0 2px; line-height: 1;
}
.bpl-remove:hover { color: #DC2626; }
.bpl-start-input {
    font-family: 'DM Mono', monospace; font-size: 10px; border: 1px solid #CBD5E1;
    border-radius: 3px; padding: 1px 4px; outline: none;
}
.bpl-muted { color: #94A3B8; }
</style>
{% endblock %}

{% block content %}
<div class="module-header">
    <h2>Berth Planning</h2>
    <span class="module-code">BPL01</span>
</div>

<div class="bpl-wrap">
    <div class="bpl-side">
        <p class="bpl-panel-hdr">
            Vessels
            <label style="margin-left:auto"><input type="checkbox" id="bpl-show-all" onchange="load()"> show berthed</label>
        </p>
        <div id="bpl-expected"></div>
    </div>
    <div class="bpl-lanes">
        <p class="bpl-panel-hdr">Berths</p>
        <div id="bpl-lanes"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const CAN_WRITE  = {{ 'true' if permissions.can_add or permissions.can_edit else 'false' }};
const CAN_DELETE = {{ 'true' if permissions.can_delete else 'false' }};

let canvas = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = p => `${p.source}:${p.source_id}`;

function fmt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Hours come from the server (parcels: qty/rate; docs and delays: typed).
// Shown to 2 dp only when fractional, so "15" stays "15" and 4.2 stays "4.2".
const fmtHours = h => (h === null || h === undefined) ? ''
    : (Math.round(h * 100) / 100).toString();

function renderExpected() {
    const el = document.getElementById('bpl-expected');
    if (!canvas.expected.length) {
        el.innerHTML = '<p class="bpl-empty">Nothing waiting to be planned.</p>';
        return;
    }
    el.innerHTML = canvas.expected.map(v => `
        <div class="bpl-ev ${v.source === 'VCN' ? 'vcn' : ''}" ${CAN_WRITE ? 'draggable="true"' : ''}
             data-source="${v.source}" data-id="${v.source_id}">
            <div class="bpl-ev-name">
                ${esc(v.vessel_name)}
                <span class="bpl-src ${v.source === 'VCN' ? 'vcn' : ''}">${v.source}</span>
            </div>
            <div class="bpl-ev-meta">
                ${esc(v.cargo_name || '—')}<br>
                ${esc(v.quantity || '—')} MT &middot; ETA ${v.eta ? fmt(v.eta) : '—'}
            </div>
        </div>`).join('');
    el.querySelectorAll('.bpl-ev').forEach(card => {
        card.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', `${card.dataset.source}:${card.dataset.id}`);
            card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });
}

function options(list, selected, placeholder) {
    return `<option value="">${placeholder}</option>` + (list || []).map(n =>
        `<option value="${esc(n)}" ${n === selected ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

// Parcels declared on the VCN this plan belongs to, as picker options.
// Labelled "P1 — HSD" so the planner sees the cargo while the plan stores the
// parcel's identity.
function parcelOptions(pl, selected) {
    const opts = (pl.available_parcels || []).map(p =>
        `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${
            esc(p.name)}${p.cargo_name ? ' — ' + esc(p.cargo_name) : ''}</option>`).join('');
    return `<option value="">— select parcel —</option>${opts}`;
}

function renderItem(pl, k, idx, it) {
    const dis = CAN_WRITE ? '' : 'disabled';
    const isParcel = it.kind === 'parcel';
    const linkable = isParcel && (pl.available_parcels || []).length > 0;
    const broken = it.start && !it.end;

    // Particular: fixed docs are label-only; delays pick from the delay master;
    // a parcel on a VCN picks a real declared parcel, so the plan row keeps its
    // identity; an EV01 vessel is pre-VCN and has nothing to link to, so it
    // stays free text.
    let particular;
    if (it.fixed) particular = esc(it.name);
    else if (it.kind === 'delay')
        particular = `<select ${dis} onchange="editItem('${k}',${idx},'name',this.value)">
                        ${options(canvas.delay_types, it.name, '— select delay —')}</select>`;
    else if (linkable)
        particular = `<select ${dis} onchange="linkParcel('${k}',${idx},this.value)">
                        ${parcelOptions(pl, it.parcel_id)}</select>`;
    else
        particular = `<input class="name" ${dis} value="${esc(it.name ?? '')}" placeholder="cargo"
                        onchange="editItem('${k}',${idx},'name',this.value)">`;

    // a linked parcel's qty is the VCN's, shown but not editable here
    const qtyCell = !isParcel ? ''
        : (it.parcel_id
            ? `<span class="bpl-muted" title="From the VCN parcel">${esc(it.qty ?? '')}</span>`
            : `<input type="number" step="0.001" ${dis} value="${esc(it.qty ?? '')}"
                 onchange="editItem('${k}',${idx},'qty',this.value)">`);

    // delays may name a pipeline too — then they hold only that line
    const pipeCell = (isParcel || it.kind === 'delay')
        ? `<select ${dis} onchange="editItem('${k}',${idx},'pipeline',this.value)">
             ${options(canvas.pipelines, it.pipeline, isParcel ? '—' : '— whole vessel —')}</select>`
        : '';

    return `
    <tr class="${it.kind} ${broken ? 'broken' : ''}">
        <td class="particular">${particular}</td>
        <td>${qtyCell}</td>
        <td>${pipeCell}</td>
        <td>${isParcel ? `<input type="number" step="0.01" min="0" ${dis} value="${esc(it.rate ?? '')}"
                onchange="editItem('${k}',${idx},'rate',this.value)">` : ''}</td>
        <td class="hours">${isParcel
            ? fmtHours(it.hours)
            : `<input type="number" step="0.25" min="0" ${dis} value="${esc(it.hours ?? '')}"
                 onchange="editItem('${k}',${idx},'hours',this.value)">`}</td>
        <td class="time">${it.start ? fmt(it.start) : (broken ? 'no hours' : '—')}</td>
        <td class="time">${it.end ? fmt(it.end) : '—'}</td>
        <td style="width:18px">${(CAN_WRITE && !it.fixed)
            ? `<button class="bpl-remove" title="Remove line" onclick="removeItem('${k}',${idx})">&#10005;</button>`
            : ''}</td>
    </tr>`;
}

function renderVessel(pl) {
    const k = key(pl);
    const items = pl.items || [];
    return `
    <div class="bpl-vessel ${pl.conflict_with ? 'conflict' : ''}">
        <div class="bpl-vessel-hdr">
            <b>${esc(pl.vessel_name)}</b>
            <span class="bpl-src ${pl.source === 'VCN' ? 'vcn' : ''}">${pl.source}</span>
            ${pl.conflict_with
                ? `<span class="bpl-conflict">starts before ${esc(pl.conflict_with)} frees the berth</span>` : ''}
            <label class="bpl-sim" title="Uncheck for a vessel that cannot work two lines at once, whatever the berth offers">
                <input type="checkbox" ${pl.simultaneous ? 'checked' : ''}
                       ${CAN_WRITE ? '' : 'disabled'}
                       onchange="editSimultaneous('${k}', this.checked)">
                simultaneous
            </label>
            <span class="times">
                start
                <input type="datetime-local" class="bpl-start-input" ${CAN_WRITE ? '' : 'disabled'}
                       value="${esc((pl.start_dt || pl.start || '').slice(0, 16))}"
                       title="${pl.start_dt ? 'Pinned start' : 'Derived from the vessel ahead — set to pin'}"
                       onchange="editStart('${k}', this.value)">
                &rarr; ${fmt(pl.end)}
            </span>
            ${CAN_DELETE ? `<button class="bpl-remove" title="Remove from plan"
                               onclick="removePlan('${k}')">&#10005;</button>` : ''}
        </div>
        <table class="bpl-items">
            <tr>
                <th style="width:26%">Particular</th><th style="width:9%">Qty</th>
                <th style="width:15%">Pipeline</th><th style="width:13%">Flow Rate in MT/Hr</th>
                <th style="width:6%">Hrs</th><th style="width:15%">Start time</th>
                <th style="width:15%">End Time</th><th></th>
            </tr>
            ${items.map((it, i) => renderItem(pl, k, i, it)).join('')}
        </table>
        ${CAN_WRITE ? `<div class="bpl-addrow">
            <button class="bpl-linkbtn" onclick="addItem('${k}','parcel')">+ parcel</button>
            <button class="bpl-linkbtn warn" onclick="addItem('${k}','delay')">+ delay</button>
            <span class="bpl-muted">inserted before ${esc(POST_DOC)}</span>
        </div>` : ''}
    </div>`;
}

// A vessel actually alongside. Shown in the same table so the lane reads as
// one story, but every cell is plain text — these are actuals from LUEU01,
// not something the planner may edit here.
function renderBerthed(o) {
    const items = o.items || [];
    return `
    <div class="bpl-vessel berthed">
        <div class="bpl-vessel-hdr" style="border-color:#22C55E;background:#F0FDF4">
            <b>${esc(o.vessel_name)}</b>
            <span class="bpl-tag actual">Berthed</span>
            <span class="bpl-muted">${esc(o.cargo || '')}</span>
            <span class="times">alongside ${esc(o.alongside || '—')}
                &rarr; ETC ${fmt(o.end)}${o.is_planned ? ' (Exp)' : ''}</span>
        </div>
        ${items.length ? `
        <table class="bpl-items readonly">
            <tr>
                <th style="width:26%">Particular</th><th style="width:9%">Qty</th>
                <th style="width:15%">Pipeline</th><th style="width:13%">Actual Rate MT/Hr</th>
                <th style="width:6%">Hrs</th><th style="width:15%">Start time</th>
                <th style="width:15%">End Time</th><th></th>
            </tr>
            ${items.map(i => `
            <tr class="parcel">
                <td class="particular">${esc(i.name)}</td>
                <td>${esc(i.qty ?? '')}</td>
                <td>${esc(i.pipeline || '')}</td>
                <td>${esc(i.rate ?? '')}</td>
                <td class="hours">${fmtHours(i.hours)}</td>
                <td class="time">${i.start ? fmt(i.start) : '—'}</td>
                <td class="time">${i.end ? fmt(i.end) : 'in progress'}</td>
                <td></td>
            </tr>`).join('')}
        </table>` : ''}
    </div>`;
}

function renderLane(lane) {
    const occupied = lane.occupied.map(renderBerthed).join('');

    const plans = lane.plans.map(renderVessel).join('');
    const body = (occupied + plans) || '<p class="bpl-empty">Drop a vessel here.</p>';
    const free = lane.plans.length ? lane.plans[lane.plans.length - 1].end
               : (lane.occupied.length ? lane.occupied[lane.occupied.length - 1].end : null);
    return `
        <div class="bpl-lane" data-berth="${esc(lane.berth_name)}">
            <div class="bpl-lane-hdr">
                ${esc(lane.berth_name)}
                <span class="free">${free ? 'free from ' + fmt(free) : 'free'}</span>
            </div>
            <div class="bpl-lane-body">${body}</div>
        </div>`;
}

function renderLanes() {
    const el = document.getElementById('bpl-lanes');
    if (!canvas.lanes.length) {
        el.innerHTML = '<p class="bpl-empty">No berths configured — add them in PBM01.</p>';
        return;
    }
    el.innerHTML = canvas.lanes.map(renderLane).join('');
    if (!CAN_WRITE) return;
    el.querySelectorAll('.bpl-lane').forEach(lane => {
        lane.addEventListener('dragover', e => { e.preventDefault(); lane.classList.add('drop-over'); });
        lane.addEventListener('dragleave', () => lane.classList.remove('drop-over'));
        lane.addEventListener('drop', e => {
            e.preventDefault();
            lane.classList.remove('drop-over');
            const [source, id] = (e.dataTransfer.getData('text/plain') || '').split(':');
            if (source && id) post('/api/module/BPL01/plan',
                {source, source_id: +id, berth_name: lane.dataset.berth});
        });
    });
}

async function post(url, body) {
    const res = await fetch(url, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) { alert(out.error || 'Save failed'); return false; }
    await load();
    return true;
}

// Every edit re-POSTs the whole vessel and re-renders from the response —
// the same save-then-refresh shape LUEU01 uses, so the server owns the chain
// and there is no client-side state to drift out of step.
function findPlan(k) {
    for (const lane of canvas.lanes) {
        const pl = lane.plans.find(p => key(p) === k);
        if (pl) return pl;
    }
    return null;
}

// strip server-computed fields — the API only accepts an item's own keys
const clean = items => items.map(i => ({
    kind: i.kind, name: i.name, qty: i.qty, pipeline: i.pipeline,
    rate: i.rate, hours: i.kind === 'parcel' ? null : i.hours, fixed: i.fixed,
    parcel_id: i.parcel_id
}));

function savePlan(pl, items, startDt, sim) {
    return post('/api/module/BPL01/plan', {
        source: pl.source, source_id: pl.source_id, berth_name: pl.berth_name,
        items, start_dt: startDt === undefined ? pl.start_dt : startDt,
        simultaneous: sim === undefined ? pl.simultaneous : sim
    });
}

// Off for a vessel whose own pumps cannot work two lines at once — the
// pipelines then grant no overlap and every line queues.
function editSimultaneous(k, checked) {
    const pl = findPlan(k); if (!pl) return;
    savePlan(pl, clean(pl.items), undefined, checked);
}

function editItem(k, idx, field, value) {
    const pl = findPlan(k); if (!pl) return;
    const items = clean(pl.items);
    items[idx][field] = value === '' ? null : value;
    savePlan(pl, items);
}

// Point a plan row at a real VCN parcel. Name and quantity then come from the
// VCN itself on every read, so the plan can't drift from the declaration.
function linkParcel(k, idx, value) {
    const pl = findPlan(k); if (!pl) return;
    const items = clean(pl.items);
    const src = (pl.available_parcels || []).find(p => String(p.id) === String(value));
    items[idx].parcel_id = src ? src.id : null;
    if (src && !items[idx].pipeline) items[idx].pipeline = src.pipeline;
    savePlan(pl, items);
}

function addItem(k, kind) {
    const pl = findPlan(k); if (!pl) return;
    const items = clean(pl.items);
    const at = items.findIndex(i => i.fixed && i.name === POST_DOC);
    items.splice(at < 0 ? items.length : at, 0, {
        kind, name: null, qty: null, pipeline: null, rate: null,
        hours: kind === 'parcel' ? null : canvas.doc_hours, fixed: false,
        parcel_id: null
    });
    savePlan(pl, items);
}

function removeItem(k, idx) {
    const pl = findPlan(k); if (!pl) return;
    const items = clean(pl.items);
    items.splice(idx, 1);
    savePlan(pl, items);
}

function editStart(k, value) {
    const pl = findPlan(k); if (!pl) return;
    savePlan(pl, clean(pl.items), value || null);
}

function removePlan(k) {
    const pl = findPlan(k); if (!pl) return;
    post('/api/module/BPL01/plan/delete', {source: pl.source, source_id: pl.source_id});
}

const POST_DOC = 'Post Documentation';

async function load() {
    const showAll = document.getElementById('bpl-show-all').checked ? '?show_all=1' : '';
    canvas = await fetch('/api/module/BPL01/data' + showAll).then(r => r.json());
    renderExpected();
    renderLanes();
}

load();
</script>
{% endblock %}
